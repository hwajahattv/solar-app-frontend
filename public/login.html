<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Knox Solar — Unlock</title>
    <style>
      :root {
        color-scheme: dark;
        --bg0: #0b1220;
        --bg1: #121a2b;
        --text: #e8eefc;
        --muted: #9aadc8;
        --accent: #3d9cfd;
        --danger: #ff6b6b;
        --field: #1a2438;
        --ring: rgba(61, 156, 253, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(61, 156, 253, 0.18), transparent 55%),
          radial-gradient(900px 500px at 90% 0%, rgba(56, 214, 168, 0.12), transparent 50%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: min(100%, 22rem);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1.25rem;
      }

      .brand__mark {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 0.55rem;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #2f7fd6, #1f5fa8);
        font-size: 1.15rem;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }

      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }

      input {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 0.55rem;
        background: var(--field);
        color: var(--text);
        font-size: 1.35rem;
        letter-spacing: 0.35em;
        text-align: center;
        padding: 0.85rem 0.75rem;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }

      button {
        width: 100%;
        margin-top: 1rem;
        border: 0;
        border-radius: 0.55rem;
        background: var(--accent);
        color: #041018;
        font-weight: 650;
        font-size: 0.95rem;
        padding: 0.85rem 1rem;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .error {
        min-height: 1.25rem;
        margin-top: 0.75rem;
        color: var(--danger);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">☀</div>
        <h1>Knox Solar</h1>
      </div>
      <p>Enter the access PIN to open the dashboard.</p>
      <form id="pin-form" autocomplete="off">
        <label for="pin">Access PIN</label>
        <input
          id="pin"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="12"
          required
          autofocus
          aria-describedby="pin-error"
        />
        <button type="submit" id="submit">Unlock</button>
        <div class="error" id="pin-error" role="alert"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById('pin-form');
      const input = document.getElementById('pin');
      const button = document.getElementById('submit');
      const error = document.getElementById('pin-error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;
        try {
          const response = await fetch('/api/pin/unlock', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: input.value }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            error.textContent = data.error || 'Unable to unlock';
            input.select();
            return;
          }
          window.location.href = '/';
        } catch {
          error.textContent = 'Network error — try again';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
