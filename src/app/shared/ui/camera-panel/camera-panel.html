<div class="camera knox-card knox-card--flush">
  <header class="camera__head">
    <mat-icon>videocam</mat-icon>
    <span class="camera__title">Home camera</span>
    <span class="camera__status" [attr.data-state]="state()">{{ state() }}</span>

    <span class="knox-spacer"></span>

    @if (state() !== 'unavailable') {
      <button mat-icon-button type="button" (click)="toggle()" [attr.aria-label]="state() === 'live' ? 'Stop camera' : 'Start camera'">
        <mat-icon>{{ state() === 'live' || state() === 'connecting' ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>
      <button mat-icon-button type="button" (click)="openSnapshot()" aria-label="Open snapshot">
        <mat-icon>photo_camera</mat-icon>
      </button>
    }
  </header>

  <div class="camera__view">
    @if (streamUrl(); as url) {
      <img class="camera__image" [src]="url" alt="Live camera feed" (load)="onLoad()" (error)="onError()" />
    } @else {
      <div class="camera__placeholder">
        <mat-icon>videocam_off</mat-icon>
        <p>{{ message() }}</p>
        @if (state() === 'error' || state() === 'idle') {
          <button mat-stroked-button type="button" (click)="start()">Retry</button>
        }
      </div>
    }
  </div>
</div>
